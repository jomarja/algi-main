server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/algi;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Open banking, the AI coach and the mock bank run in the Node server (deploy/algi.service).
    include snippets/algi-api.conf;

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: every other path falls back to index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
