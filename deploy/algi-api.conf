# Included from the site's server block (installed as /etc/nginx/snippets/algi-api.conf).
# Forwards the API and the mock TBC bank to the Node server on port 8787.

location /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The coach streams its answer as Server-Sent Events; don't hold it back.
    proxy_buffering off;
    proxy_read_timeout 300s;
}

location /mock-tbc/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
